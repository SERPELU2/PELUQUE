<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D241E"/>
      <stop offset="100%" stop-color="#1A1512"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado elegante tipo App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6"/>
  
  <!-- Tijeras estilizadas de peluquería en oro -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(14) translate(-12, -12)">
    <circle cx="6" cy="6" r="2.8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <circle cx="6" cy="18" r="2.8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="8.3" y1="8" x2="20" y2="19.7" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8.3" y1="16" x2="20" y2="4.3" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="13.2" cy="12" r="1.3" fill="url(#goldGrad)"/>
  </g>
</svg>